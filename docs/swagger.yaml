basePath: /
definitions:
  domain.Address:
    properties:
      city:
        type: string
      complement:
        type: string
      number:
        type: string
      state:
        type: string
      street:
        type: string
      zip_code:
        type: string
    type: object
  domain.Customer:
    properties:
      address:
        $ref: '#/definitions/domain.Address'
      cnpj:
        type: string
      cpf:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      phone:
        type: string
      status:
        type: string
    type: object
  domain.Order:
    properties:
      cancellation_reason:
        description: motivo do cancelamento pela Saga
        type: string
      checkout_url:
        description: link de pagamento enviado ao cliente
        type: string
      created_at:
        type: string
      customer_id:
        type: string
      customer_name:
        type: string
      delivered_at:
        type: string
      diagnosis:
        description: Preenchidos ao longo da Saga (Fase 4)
        type: string
      diagnosis_at:
        description: |-
          DiagnosisAt/WaitingApprovalAt — junto com StartedAt/FinishedAt/DeliveredAt
          já existentes, permitem calcular o tempo médio por status (Diagnóstico,
          Execução, Finalização) exigido no dashboard da Fase 3, sem mexer no
          cálculo por tipo de serviço (GetAverageServiceTime) que já existia.
        type: string
      finished_at:
        type: string
      id:
        type: string
      notes:
        type: string
      parts:
        items:
          $ref: '#/definitions/domain.OrderPart'
        type: array
      services:
        items:
          $ref: '#/definitions/domain.OrderService'
        type: array
      started_at:
        type: string
      status:
        $ref: '#/definitions/domain.OrderStatus'
      total:
        type: number
      total_parts:
        type: number
      total_services:
        type: number
      updated_at:
        type: string
      vehicle_id:
        type: string
      vehicle_plate:
        type: string
      waiting_approval_at:
        type: string
    type: object
  domain.OrderPart:
    properties:
      part_id:
        type: string
      part_name:
        type: string
      quantity:
        type: integer
      unit_price:
        type: number
    type: object
  domain.OrderService:
    properties:
      executed_at:
        type: string
      price:
        type: number
      service_id:
        type: string
      service_name:
        type: string
    type: object
  domain.OrderStatus:
    enum:
    - recebida
    - em_diagnostico
    - aguardando_aprovacao
    - aguardando_pagamento
    - aguardando_execucao
    - em_execucao
    - finalizada
    - entregue
    - recusada
    - cancelada
    type: string
    x-enum-comments:
      StatusCancelled: falha em algum passo da Saga
      StatusRejected: cliente recusou o orçamento
      StatusWaitingPayment: aprovada, peças reservadas, aguardando o pagamento
      StatusWaitingRepair: paga, na fila de reparo da oficina
    x-enum-descriptions:
    - ""
    - ""
    - ""
    - aprovada, peças reservadas, aguardando o pagamento
    - paga, na fila de reparo da oficina
    - ""
    - ""
    - ""
    - cliente recusou o orçamento
    - falha em algum passo da Saga
    x-enum-varnames:
    - StatusReceived
    - StatusDiagnosis
    - StatusWaitingApproval
    - StatusWaitingPayment
    - StatusWaitingRepair
    - StatusInProgress
    - StatusFinished
    - StatusDelivered
    - StatusRejected
    - StatusCancelled
  domain.Service:
    properties:
      created_at:
        type: string
      description:
        type: string
      estimated_time:
        description: em minutos
        type: integer
      id:
        type: string
      name:
        type: string
      price:
        type: number
    type: object
  domain.Vehicle:
    properties:
      brand:
        type: string
      customer_id:
        type: string
      id:
        type: string
      model:
        type: string
      plate:
        type: string
      year:
        type: integer
    type: object
  dto.AddressRequest:
    properties:
      city:
        type: string
      complement:
        type: string
      number:
        type: string
      state:
        type: string
      street:
        type: string
      zip_code:
        type: string
    required:
    - city
    - number
    - state
    - street
    - zip_code
    type: object
  dto.ApproveOrderRequest:
    properties:
      approved:
        type: boolean
      reason:
        description: motivo caso recuse
        type: string
    required:
    - approved
    type: object
  dto.CreateCustomerRequest:
    properties:
      address:
        $ref: '#/definitions/dto.AddressRequest'
      cnpj:
        type: string
      cpf:
        type: string
      email:
        type: string
      name:
        type: string
      phone:
        type: string
    required:
    - address
    - email
    - name
    - phone
    type: object
  dto.CreateOrderRequest:
    properties:
      customer_id:
        type: string
      notes:
        type: string
      parts:
        items:
          $ref: '#/definitions/dto.OrderPartRequest'
        type: array
      services:
        items:
          $ref: '#/definitions/dto.OrderServiceRequest'
        type: array
      vehicle_id:
        type: string
    required:
    - customer_id
    - services
    - vehicle_id
    type: object
  dto.CreateServiceRequest:
    properties:
      description:
        type: string
      estimated_time:
        type: integer
      name:
        type: string
      price:
        type: number
    required:
    - estimated_time
    - name
    - price
    type: object
  dto.CreateVehicleRequest:
    properties:
      brand:
        type: string
      customer_id:
        type: string
      model:
        type: string
      plate:
        type: string
      year:
        type: integer
    required:
    - brand
    - customer_id
    - model
    - plate
    - year
    type: object
  dto.EmailStatusUpdateRequest:
    properties:
      from:
        type: string
      order_id:
        type: string
      status:
        type: string
      subject:
        type: string
    type: object
  dto.InternalCustomerResponse:
    properties:
      id:
        type: string
      name:
        type: string
      status:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      name:
        type: string
      role:
        type: string
      token:
        type: string
    type: object
  dto.OrderPartRequest:
    properties:
      part_id:
        type: string
      quantity:
        type: integer
    required:
    - part_id
    - quantity
    type: object
  dto.OrderServiceRequest:
    properties:
      service_id:
        type: string
    required:
    - service_id
    type: object
  dto.OrderStatusResponse:
    properties:
      id:
        type: string
      status:
        type: string
      status_label:
        type: string
      updated_at:
        type: string
    type: object
  dto.UpdateCustomerRequest:
    properties:
      address:
        $ref: '#/definitions/dto.AddressRequest'
      cnpj:
        type: string
      cpf:
        type: string
      email:
        type: string
      name:
        type: string
      phone:
        type: string
    required:
    - address
    - email
    - name
    - phone
    type: object
  dto.UpdateCustomerStatusRequest:
    properties:
      status:
        enum:
        - ativo
        - inativo
        type: string
    required:
    - status
    type: object
  dto.UpdateOrderStatusRequest:
    properties:
      status:
        type: string
    required:
    - status
    type: object
  dto.UpdateServiceRequest:
    properties:
      description:
        type: string
      estimated_time:
        type: integer
      name:
        type: string
      price:
        type: number
    required:
    - estimated_time
    - name
    - price
    type: object
  dto.UpdateVehicleRequest:
    properties:
      brand:
        type: string
      model:
        type: string
      plate:
        type: string
      year:
        type: integer
    required:
    - brand
    - model
    - plate
    - year
    type: object
info:
  contact:
    email: suporte@autoshop.com
    name: Suporte AutoShop
  description: API de gestão de ordens de serviço para oficina mecânica
  license:
    name: MIT
  termsOfService: http://swagger.io/terms/
  title: AutoShop API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Autentica o usuário e retorna o token JWT
      parameters:
      - description: Credenciais
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Login
      tags:
      - auth
  /customers:
    get:
      description: Retorna todos os clientes cadastrados
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Customer'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Listar clientes
      tags:
      - customers
    post:
      consumes:
      - application/json
      description: Cria um novo cliente no sistema
      parameters:
      - description: Dados do cliente
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCustomerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Customer'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Criar cliente
      tags:
      - customers
  /customers/{id}:
    delete:
      description: Remove um cliente do sistema
      parameters:
      - description: ID do cliente
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Deletar cliente
      tags:
      - customers
    get:
      description: Retorna um cliente pelo ID
      parameters:
      - description: ID do cliente
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Customer'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Buscar cliente
      tags:
      - customers
    put:
      consumes:
      - application/json
      description: Atualiza os dados de um cliente existente
      parameters:
      - description: ID do cliente
        in: path
        name: id
        required: true
        type: string
      - description: Dados atualizados do cliente
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateCustomerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Customer'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Atualizar cliente
      tags:
      - customers
  /customers/{id}/status:
    patch:
      consumes:
      - application/json
      description: |-
        Muda o status do cliente (ativo/inativo). Um cliente inativo
        continua existindo na base, mas o fluxo de autenticação por
        CPF (lambda-auth-autoshop) passa a recusar a emissão de token
        pra ele — é a checagem de "status do cliente" exigida na Fase 3.
      parameters:
      - description: ID do cliente
        in: path
        name: id
        required: true
        type: string
      - description: Novo status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateCustomerStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Customer'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Ativar/inativar cliente
      tags:
      - customers
  /health:
    get:
      description: Indica se o processo da API está de pé
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - health
  /integrations/email/orders/status:
    post:
      consumes:
      - application/json
      description: Webhook para provedores de e-mail notificarem uma mudança de status
        da OS
      parameters:
      - description: Token secreto do webhook
        in: header
        name: X-Webhook-Token
        required: true
        type: string
      - description: Conteúdo do e-mail recebido
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.EmailStatusUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Order'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties: true
            type: object
      summary: Atualizar status da OS via e-mail
      tags:
      - integrations
  /internal/customers/by-cpf/{cpf}:
    get:
      description: Usada pela função de autenticação por CPF, que não acessa o banco
        do OS Service. Exige um token de serviço (role "service").
      parameters:
      - description: CPF, com ou sem pontuação
        in: path
        name: cpf
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.InternalCustomerResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Consultar cliente por CPF (uso interno)
      tags:
      - internal
  /orders:
    get:
      description: |-
        Retorna as ordens de serviço. Sem o filtro "status", aplica a
        regra padrão de listagem: exclui logicamente as OS finalizadas
        e entregues, e ordena por Em Execução > Aguardando Aprovação >
        Diagnóstico > Recebida (mais antigas primeiro). Com o filtro
        "status", retorna apenas as OS daquele status, sem essa regra
      parameters:
      - description: Filtrar por status (ignora a regra de ordenação padrão)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Order'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Listar OS
      tags:
      - orders
    post:
      consumes:
      - application/json
      description: |-
        Abre a OS e inicia o fluxo da Saga: a OS entra em diagnóstico e o
        Execution Service é acionado. As peças são consultadas no catálogo
        do Execution Service.
      parameters:
      - description: Dados da OS
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Order'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Criar OS
      tags:
      - orders
  /orders/{id}:
    delete:
      description: Remove uma ordem de serviço do sistema
      parameters:
      - description: ID da OS
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Deletar OS
      tags:
      - orders
    get:
      description: Retorna uma ordem de serviço pelo ID
      parameters:
      - description: ID da OS
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Order'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Buscar OS
      tags:
      - orders
  /orders/{id}/approve:
    patch:
      consumes:
      - application/json
      description: |-
        Rota pública para o cliente aprovar ou recusar o orçamento da
        OS (ex.: link enviado por e-mail). Aprovado, o fluxo segue para a
        reserva das peças e o pagamento; recusado, o orçamento é cancelado.
      parameters:
      - description: ID da OS
        in: path
        name: id
        required: true
        type: string
      - description: Aprovação
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ApproveOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Order'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties: true
            type: object
      summary: Aprovar ou recusar orçamento
      tags:
      - orders
  /orders/{id}/status:
    get:
      description: |-
        Retorna a situação atual da ordem de serviço — rota pública para
        acompanhamento pelo cliente (ex.: link enviado por e-mail)
      parameters:
      - description: ID da OS
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.OrderStatusResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Consultar status da OS
      tags:
      - orders
    patch:
      consumes:
      - application/json
      description: |-
        Registra a entrega do veículo (finalizada → entregue). Os demais
        status são atualizados pelo fluxo da Saga.
      parameters:
      - description: ID da OS
        in: path
        name: id
        required: true
        type: string
      - description: Novo status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateOrderStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Order'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Atualizar status da OS
      tags:
      - orders
  /orders/customer/{customer_id}:
    get:
      description: |-
        Retorna todas as OS de um cliente — rota sensível, exige o JWT
        emitido pela Function Serverless de autenticação por CPF
        (lambda-auth-autoshop). Um token de cliente (role "customer")
        só pode consultar o próprio customer_id; um token de
        funcionário (role "admin") pode consultar qualquer um.
      parameters:
      - description: ID do cliente
        in: path
        name: customer_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Order'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: OS por cliente
      tags:
      - orders
  /orders/metrics/average-time:
    get:
      description: Retorna o tempo médio de execução por tipo de serviço em minutos
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              format: float64
              type: number
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Tempo médio por serviço
      tags:
      - orders
  /orders/metrics/average-time-by-status:
    get:
      description: |-
        Retorna o tempo médio (em minutos) que as OS passam em cada
        status — Diagnóstico, Execução e Finalização — exigido no
        dashboard de observabilidade
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              format: float64
              type: number
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Tempo médio por status
      tags:
      - orders

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened]

# Sem permissions no nível do workflow
permissions: {}

env:
  IMAGE_NAME: autoshop-api

jobs:
  # build da aplicação + testes automatizados (unitarios) + qualidade de codigo
  test:
    name: Build + Testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Baixar dependências
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Testes unitários com cobertura
        run: go test ./internal/domain/... ./internal/usecase/... ./internal/handler/... ./internal/middleware/... ./pkg/... -coverprofile=coverage.out -covermode=atomic

      - name: SonarQube Cloud Scan
        # sonarcloud-github-action foi descontinuada pela SonarSource (scanner
        # preso ao Java 17, e o SonarQube Cloud passou a exigir Java 21+).
        # sonarqube-scan-action é a substituta oficial e provisiona o JRE certo sozinha.
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # testes de integracao, sobe um Postgres descartavel só pra este job
  integration-test:
    name: Testes de Integração
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autoshop
          POSTGRES_PASSWORD: autoshop
          POSTGRES_DB: autoshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoshop"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Baixar dependências
        run: go mod download

      - name: Rodar testes de integração
        run: go test ./internal/integration/... -v
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: autoshop
          DB_PASSWORD: autoshop
          DB_NAME: autoshop
          DB_SSLMODE: disable

  # build da imagem Docker e publicacao no GitHub Container Registry
  build-and-push:
    name: Build da Imagem Docker
    needs: [test, integration-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.full }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir nome da imagem (minúsculo — exigido pelo registry)
        id: image
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "full=ghcr.io/${OWNER_LOWER}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Login no GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.full }}

  # Depois de publicar a imagem, avisa o repositório infra-k8s: "existe uma
  # imagem nova pronta pra ir pro ar". Só dispara pra homologação (develop) —
  # o cluster de homologação é efêmero (kind, dentro do próprio runner do
  # infra-k8s), então só quem criou o cluster consegue aplicar os manifestos
  # nele, por isso o infra-k8s precisa ser avisado e buscar os manifestos
  # daqui.
  #
  # Para produção (main), NÃO disparamos mais o infra-k8s — o cluster EKS é
  # real e persistente, então este próprio repositório se autentica na AWS
  # de forma independente e aplica seus manifestos direto (job deploy-aws
  # abaixo), sem depender do infra-k8s pra nada além de o cluster já existir.
  dispatch-deploy:
    name: Disparar deploy de Homologação no infra-k8s
    needs: build-and-push
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Notificar infra-k8s com a imagem publicada
        run: |
          if [ -z "${{ secrets.INFRA_K8S_DISPATCH_TOKEN }}" ]; then
            echo "Secret INFRA_K8S_DISPATCH_TOKEN não configurado" >&2
            exit 1
          fi
          curl -sf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.INFRA_K8S_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/Jackeline2020/infra-k8s-autoshop/dispatches \
            -d '{"event_type":"deploy","client_payload":{"image":"${{ needs.build-and-push.outputs.image }}","environment":"homolog"}}'

  # Deploy real no cluster EKS — desligado por padrão (variável de
  # repositório AWS_DEPLOY_ENABLED, a mesma ideia usada no infra-k8s).
  # Assume a MESMA role de deploy que o infra-k8s-autoshop usa (compartilhada
  # via OIDC, ver infra/aws/github-oidc.tf nesse repositório — os dois
  # repositórios estão autorizados a assumi-la a partir da branch main),
  # sem nenhuma chave fixa. Este job só aplica os manifestos da aplicação —
  # pressupõe que o cluster já foi provisionado pelo infra-k8s-autoshop.
  deploy-aws:
    name: Deploy Produção (EKS real)
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      KUSTOMIZE_VERSION: v5.8.1
      AWS_REGION: us-east-1
      EKS_CLUSTER_NAME: autoshop-eks
      IMAGE: ${{ needs.build-and-push.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # DEBUG TEMPORÁRIO — remover depois de achar a causa do erro de OIDC
      - name: "DEBUG: decodificar claims do token OIDC"
        run: |
          IDTOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$IDTOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq . || echo "$IDTOKEN" | cut -d. -f2 | base64 -d

      - name: Configurar credenciais AWS via OIDC (sem chave fixa)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Apontar kubectl para o cluster EKS
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Instalar kustomize (binário oficial, com verificação de checksum)
        run: |
          curl --proto '=https' --tlsv1.2 -sLO "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -sLO "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/checksums.txt"
          sha256sum --ignore-missing -c checksums.txt
          tar -xzf "kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          sudo mv kustomize /usr/local/bin/

      - name: Definir a imagem publicada nesta execução
        working-directory: k8s/overlays/aws
        run: kustomize edit set image autoshop-api=${{ env.IMAGE }}

      - name: Injetar a IRSA role na service account
        env:
          IRSA_ROLE_ARN: ${{ secrets.IRSA_ROLE_ARN }}
        run: |
          if [ -z "$IRSA_ROLE_ARN" ]; then
            echo "Secret IRSA_ROLE_ARN não configurado — copie o output irsa_role_arn do infra-k8s-autoshop" >&2
            exit 1
          fi
          sed -i "s#IRSA_ROLE_ARN_PLACEHOLDER#${IRSA_ROLE_ARN}#" k8s/overlays/aws/serviceaccount.yaml

      - name: Injetar o endpoint do RDS no ConfigMap
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
        run: |
          if [ -z "$DB_HOST" ]; then
            echo "Secret DB_HOST não configurado — copie o output rds_endpoint do infra-db-autoshop" >&2
            exit 1
          fi
          sed -i "s#DB_HOST_PLACEHOLDER#${DB_HOST}#" k8s/overlays/aws/configmap.yaml

      - name: Buscar a senha do RDS no Secrets Manager e injetar no Secret
        run: |
          DB_PASSWORD=$(aws secretsmanager get-secret-value --secret-id autoshop/rds/credentials --query SecretString --output text | jq -r .password)
          sed -i "s#DB_PASSWORD_PLACEHOLDER#${DB_PASSWORD}#" k8s/overlays/aws/secret.yaml
      
      - name: Injetar o JWT_SECRET no Secret
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          if [ -z "$JWT_SECRET" ]; then
            echo "Secret JWT_SECRET não configurado" >&2
            exit 1
          fi
          sed -i "s#JWT_SECRET_PLACEHOLDER#${JWT_SECRET}#" k8s/overlays/aws/secret.yaml
          sed -i "s#NEW_RELIC_LICENSE_KEY_PLACEHOLDER#${NEW_RELIC_LICENSE_KEY}#" k8s/overlays/aws/secret.yaml

      - name: Garantir que o namespace autoshop existe
        run: kubectl create namespace autoshop --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicar manifestos no cluster (Deployment, Service, HPA, ConfigMap/Secret)
        run: kubectl apply -k k8s/overlays/aws

      - name: Aguardar o rollout concluir
        run: kubectl rollout status deployment/autoshop-api -n autoshop --timeout=180s
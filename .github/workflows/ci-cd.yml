name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened]

# Sem permissions no nível do workflow
permissions: {}

env:
  IMAGE_NAME: autoshop-api

jobs:
  # Build, análise estática, testes unitários e de integração (Postgres
  # descartável), cobertura mínima de 80% e análise do SonarCloud. Os testes
  # da Saga usam o SQS simulado em memória; o fluxo com filas reais roda nos
  # testes BDD do ambiente completo.
  test:
    name: Build + Testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autoshop
          POSTGRES_PASSWORD: autoshop
          POSTGRES_DB: autoshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U autoshop"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Baixar dependências
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Análise estática (go vet)
        run: go vet ./...

      - name: Testes unitários e de integração com cobertura
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: autoshop
          DB_PASSWORD: autoshop
          DB_NAME: autoshop
          DB_SSLMODE: disable
        run: ./scripts/test-all.sh

      - name: Verificar cobertura mínima (80%)
        run: ./scripts/coverage.sh

      - name: SonarQube Cloud Scan
        # sonarqube-scan-action é a substituta oficial da sonarcloud-github-action
        # (descontinuada) e provisiona o JRE certo sozinha.
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # build da imagem Docker e publicacao no GitHub Container Registry
  build-and-push:
    name: Build da Imagem Docker
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.full }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir nome da imagem (minúsculo — exigido pelo registry)
        id: image
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "full=ghcr.io/${OWNER_LOWER}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Login no GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.full }}

  # Depois de publicar a imagem, avisa o repositório infra-k8s: "existe uma
  # imagem nova pronta pra ir pro ar". Só dispara pra homologação (develop) —
  # o cluster de homologação é efêmero (kind, dentro do próprio runner do
  # infra-k8s), então só quem criou o cluster consegue aplicar os manifestos
  # nele, por isso o infra-k8s precisa ser avisado e buscar os manifestos
  # daqui.
  #
  # Para produção (main), NÃO disparamos mais o infra-k8s — o cluster EKS é
  # real e persistente, então este próprio repositório se autentica na AWS
  # de forma independente e aplica seus manifestos direto (job deploy-aws
  # abaixo), sem depender do infra-k8s pra nada além de o cluster já existir.
  dispatch-deploy:
    name: Disparar deploy de Homologação no infra-k8s
    needs: build-and-push
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Notificar infra-k8s com a imagem publicada
        run: |
          if [ -z "${{ secrets.INFRA_K8S_DISPATCH_TOKEN }}" ]; then
            echo "Secret INFRA_K8S_DISPATCH_TOKEN não configurado" >&2
            exit 1
          fi
          curl -sf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.INFRA_K8S_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/Jackeline2020/infra-k8s-autoshop/dispatches \
            -d '{"event_type":"deploy","client_payload":{"image":"${{ needs.build-and-push.outputs.image }}","environment":"homolog"}}'

  # Deploy no cluster EKS, só na main e com a variável AWS_DEPLOY_ENABLED
  # ligada (fica desligada enquanto a infraestrutura não existe). Autentica
  # na AWS por OIDC, sem chave fixa, aplica os manifestos de k8s/ e as
  # migrations do banco.
  deploy-aws:
    name: Deploy Produção (EKS real)
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Apontar o kubectl para o cluster EKS
        run: aws eks update-kubeconfig --region us-east-1 --name autoshop-eks

      - name: Aplicar manifestos, migrations e aguardar o rollout
        env:
          SERVICE: autoshop-api
          CONFIG_NAME: autoshop-config
          SECRET_NAME: autoshop-secrets
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          RUN_MIGRATIONS: "true"
          IRSA_ROLE_ARN: ${{ secrets.IRSA_ROLE_ARN }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: sh ./scripts/deploy-aws.sh

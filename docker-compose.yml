services:
  app:
    build: .
    container_name: autoshop-api
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET:-autoshop-secret-dev}
      - EMAIL_WEBHOOK_SECRET=${EMAIL_WEBHOOK_SECRET:-autoshop-webhook-dev}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-autoshop}
      - DB_PASSWORD=${DB_PASSWORD:?defina DB_PASSWORD no seu .env (veja .env.example)}
      - DB_NAME=${DB_NAME:-autoshop}
      - DB_SSLMODE=disable
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY:-}
      - NEW_RELIC_APP_NAME=${NEW_RELIC_APP_NAME:-autoshop-api}
      - NEW_RELIC_DEBUG=${NEW_RELIC_DEBUG:-false}
      # Catálogo de peças do Execution Service (rodando no compose dele)
      - EXECUTION_SERVICE_URL=${EXECUTION_SERVICE_URL:-http://host.docker.internal:8082}
      # Filas da Saga (LocalStack local; na AWS, as credenciais vêm do ambiente)
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-http://localstack:4566}
      - SAGA_STEP_TIMEOUT=${SAGA_STEP_TIMEOUT:-5m}
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  localstack:
    image: localstack/localstack:4.3
    container_name: autoshop-localstack
    ports:
      - "4568:4566"
    environment:
      - SERVICES=sqs
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
      - ./localstack/send-event.sh:/scripts/send-event.sh
      - ./localstack/read-commands.sh:/scripts/read-commands.sh
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name billing-commands >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    container_name: autoshop-postgres
    environment:
      - POSTGRES_USER=${DB_USER:-autoshop}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?defina DB_PASSWORD no seu .env (veja .env.example)}
      - POSTGRES_DB=${DB_NAME:-autoshop}
    ports:
      - "5432:5432"
    volumes:
      - autoshop-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Testa pela rede (-h 127.0.0.1): durante a criação inicial do banco o
      # Postgres sobe um servidor temporário só no socket local
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USER:-autoshop} -d ${DB_NAME:-autoshop}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    container_name: autoshop-migrate
    volumes:
      - "./migrations:/migrations"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - "-path=/migrations"
      - "-database=postgres://${DB_USER:-autoshop}:${DB_PASSWORD:?defina DB_PASSWORD no seu .env}@postgres:5432/${DB_NAME:-autoshop}?sslmode=disable"
      - "up"

volumes:
  autoshop-postgres-data:

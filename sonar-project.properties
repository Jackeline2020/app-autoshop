sonar.projectKey=Jackeline2020_app-autoshop
sonar.projectName=AutoShop API
sonar.organization=jackeline2020

sonar.sources=.
sonar.exclusions=**/*_test.go,**/docs/**,**/mocks/**,**/vendor/**,localstack/**

sonar.tests=.
sonar.test.inclusions=**/*_test.go

sonar.go.coverage.reportPaths=coverage.out
sonar.sourceEncoding=UTF-8

# Código de inicialização (subida do servidor, dos workers e do agente do
# New Relic), sem regra de negócio. Os repositórios entram na cobertura
# pelos testes de integração, que rodam no mesmo job contra um Postgres.
sonar.coverage.exclusions=cmd/**,pkg/observability/**
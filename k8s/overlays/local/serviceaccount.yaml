# imagePullSecrets aponta pra um Secret que só existe no ambiente da
# pipeline (infra-k8s-autoshop/infra/ci, criado a partir do GITHUB_TOKEN da
# própria execução, pra puxar a imagem do GHCR). No ambiente local dessa
# máquina esse Secret nunca é criado.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: autoshop-api
  namespace: autoshop
imagePullSecrets:
  - name: ghcr-pull-secret

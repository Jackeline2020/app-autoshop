apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# O namespace "autoshop" é criado pelo repositório infra-k8s-autoshop (é
# infraestrutura do cluster, não da aplicação) — por isso não é listado
# aqui, diferente de antes da reorganização.
resources:
  - ../../base
  - configmap.yaml
  - secret.yaml
  - serviceaccount.yaml

# Na AWS, exposto por um Load Balancer (no kind local continua NodePort)
patches:
  - target:
      kind: Service
      name: autoshop-api
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer

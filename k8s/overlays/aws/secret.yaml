# Placeholders — este arquivo é aplicado via "kubectl apply -k" e não deve chegar num ambiente AWS
# real com esses valores. O workflow de deploy (ci-cd.yml, job deploy-aws) substitui os
# *_PLACEHOLDER por segredos reais do GitHub antes de aplicar.
apiVersion: v1
kind: Secret
metadata:
  name: autoshop-secrets
  namespace: autoshop
type: Opaque
stringData:
  JWT_SECRET: "JWT_SECRET_PLACEHOLDER"
  EMAIL_WEBHOOK_SECRET: "CHANGE_ME_BEFORE_REAL_DEPLOY"
  DB_PASSWORD: "DB_PASSWORD_PLACEHOLDER"
  NEW_RELIC_LICENSE_KEY: "NEW_RELIC_LICENSE_KEY_PLACEHOLDER"
